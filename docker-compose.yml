name: jobs_automation

services:
  postgres:
    image: postgres:16
    container_name: jobs_automation_postgres
    restart: "no"
    env_file:
      - .env
    environment:
      POSTGRES_USER: '${USER}'
      POSTGRES_PASSWORD: ${PASSWORD}
      POSTGRES_DB: ${DB}
    ports:
      - "${PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USER} -d ${DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
    container_name: jobs_automation_app
    restart: "no"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    command: python main.py --headless

volumes:
  postgres_data: